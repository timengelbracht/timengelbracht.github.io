# Everything you might ever want to change by hand lives in this file (and in content/).
# Papers are NOT listed here: `python -m sitegen sync` pulls them automatically every week.

name: Tim Engelbracht
greeting: "Hi, I'm Tim."
# [[keyword]] gets a hand-drawn underline; [text](url) becomes a link.
bio: >-
  I'm a Doctoral Fellow at the [ETH AI Center](https://ai.ethz.ch) and ETH Zürich,
  supervised by Prof. Marc Pollefeys and Prof. Stefan Leutenegger.
  I work on robots that understand scenes by interacting with them:
  [[mobile manipulation]], [[force-grounded perception]] and [[scene understanding]].
# Optional "now:" line under the bio (left out while empty), e.g.
#   now: bringing scene representations and contact forces into the context of robot policies.
now: ""

# Short line used for link previews (Slack, LinkedIn, X) and search engines.
tagline: Doctoral Fellow at the ETH AI Center and ETH Zürich, working on robots that understand scenes by interacting with them.
# Where the site lives. Link previews need the full address. Change it if your repo has another name.
url: https://timengelbracht.github.io
social_image: assets/social.png

# Contact. The address is shown in a form that address-harvesting bots can't read easily.
email: tengelbracht@ethz.ch
office: ""   # e.g. "CAB G 85.1, Universitätstrasse 6, 8092 Zürich" (left out while empty)

# The little robot that follows the mouse. Off to keep the page calm.
cursor_robot: false
# The light switch (top right) that toggles dark mode. Off to keep the page calm;
# the page still follows the visitor's system light/dark setting.
light_switch: false

# Put your photo at assets/headshot.jpg (square works best). Until then a placeholder shows.
headshot: assets/headshot.jpg

# Links whose address still contains YOUR_ or points to a file that doesn't exist yet are hidden.
links:
  - { label: Scholar, url: "https://scholar.google.com/citations?user=YOUR_SCHOLAR_ID" }
  - { label: GitHub, url: "https://github.com/timengelbracht" }
  - { label: LinkedIn, url: "https://www.linkedin.com/in/timengelbracht/" }
  - { label: CV, url: "assets/cv.pdf" }

# ---- where papers come from -------------------------------------------------
sources:
  # Your Google Scholar user id (the part after "user=" in your profile URL).
  # Leave empty to skip Scholar; Semantic Scholar is then the only list.
  google_scholar_id: ""
  # Semantic Scholar sometimes splits one person into several profiles.
  # List every profile id that is you. Find them at semanticscholar.org.
  semantic_scholar_ids: ["2363878466"]
  # Papers the lists above miss (arXiv ids). Optional.
  extra_arxiv_ids: ["2409.11870"]   # SpotLight is not on the Semantic Scholar profile yet
  # Titles (or arXiv ids) you never want on the site. Optional.
  exclude: []

# Where your own project pages usually live; {short} is the paper's short name
# (e.g. "SpotLight"). Used only when no project page is linked from the paper itself.
project_page_guesses: ["https://timengelbracht.github.io/{short}/"]

# Your name as it appears in author lists, so it can be underlined.
my_author_names: ["Tim Engelbracht", "T. Engelbracht"]

# ---- collaborators ------------------------------------------------------------
# key:    shown up front, in this order. `url` is optional and should be their own page.
# others: "all" = every other co-author of your papers, tucked behind "+N more"
#         (updates itself with new papers), or a list like `key`, or [] for nobody.
# hide:   names never shown.
collaborators:
  key:
    - { name: Zuria Bauer }
    - { name: René Zurbrügg }
    - { name: Hermann Blum }
    - { name: Marc Pollefeys }
  others: all
  hide: []
