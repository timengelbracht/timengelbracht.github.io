name: ci
on:
  pull_request:
  push:
    branches-ignore: [main]   # main is covered by the deploy workflow
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync
      - run: uv run ruff check . && uv run ruff format --check .
      - run: uv run python tools/check_structure.py
      - run: uv run lint-imports
      - run: uv run pylint --disable=all --enable=duplicate-code src
      - run: uv run mypy src
      - run: uv run pytest
      - run: uv run sitegen build
